plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
}

group = 'com.example'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// OpenAPI/Swagger UI for Spring Boot 3.x
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

checkstyle {
	// Use a broadly compatible Checkstyle version to avoid DTD/module mismatches
	toolVersion = '10.3.4'
	// Use bundled default to avoid custom XML issues; can switch back to custom later if needed
	config = resources.text.fromFile("${rootProject.projectDir}/config/checkstyle/checkstyle.xml", "UTF-8")
	ignoreFailures = true
	showViolations = true
}

tasks.withType(Checkstyle).configureEach {
	// Ensure Checkstyle has a classpath; without this, some versions can't initialize Root Module
	classpath = files(sourceSets.main.output) + configurations.compileClasspath
}

tasks.withType(Checkstyle).configureEach {
	reports {
		html.required = true
		xml.required = false
	}
}
